<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="/assets/css/socle.css"><link rel="stylesheet" href="/assets/css/site.css">
<style>:root{--fond:#0b0b0c;--texte:#f2ede4}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0b0b0c;color:#f2ede4}
.p{position:relative;display:grid;grid-template-columns:520px 680px;width:1200px;height:630px}
.p-texte{display:flex;flex-direction:column;justify-content:space-between;padding:56px 40px 52px 64px;position:relative;z-index:1}
.p-logo{display:flex;align-items:center;gap:14px;font:400 30px/1 var(--police-titres)}
.p-logo img{width:64px;height:64px}
.p-titre{font:400 58px/1.02 var(--police-titres);margin:0;text-wrap:balance}
.p-titre em{color:#d4bc86}
.p-sous{font:500 19px/1.35 var(--police-texte);margin:14px 0 0;color:#cfc8bb;letter-spacing:.02em}
.p-pied{font:500 15px/1 var(--police-texte);letter-spacing:.18em;text-transform:uppercase;color:#b89a5e;margin:0}
.p-image{position:relative;overflow:hidden;background:radial-gradient(ellipse 60% 55% at 50% 45%,#3a2f22 0,#16120e 55%,#0b0b0c 100%)}
.p-image.photo{background:#111 center/cover no-repeat}
.p-cadre{position:absolute;inset:60px 70px 70px;display:grid;place-items:center}
.p-cadre img{max-width:100%;max-height:100%;width:auto;height:auto;padding:10px;background:#0a0a0a;box-shadow:0 0 0 1px #2b2b2b,22px 30px 50px rgba(0,0,0,.75)}</style>
</head><body>
<div class="p">
  <div class="p-texte">
    <p class="p-logo"><img src="/assets/images/logo-nuit-256.png" alt="">Sequoia Studio</p>
    <div><p class="p-titre">Rencontre du Destin</p><p class="p-sous">Francesco Conte · Lavis d’encre, 2026</p></div>
    <p class="p-pied">Édition limitée de 30 exemplaires</p>
  </div>
  <div class="p-image"><div class="p-cadre"><img src="/assets/images/oeuvres/rencontre-du-destin-800.webp" alt=""></div></div>
</div>
</body></html>
